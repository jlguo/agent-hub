# Codecov Configuration
# See: https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 5%
        base: auto
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    
    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

parsers:
  gcov: false
  javascript:
    enable_partials: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "client/**/*"
  - "coverage/**/*"
  - "node_modules/**/*"
  - "**/*.config.js"
  - "**/*.config.ts"
  - "scripts/validate-tests.ts"
