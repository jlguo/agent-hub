apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-hub.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-hub.labels" . | nindent 4 }}
    app: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "agent-hub.selectorLabels" . | nindent 4 }}
    app: frontend
