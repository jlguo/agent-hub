{{- if .Values.sshTunnel.enabled }}
# Kubernetes Secrets for Remote Mode
# IMPORTANT: Create actual secrets with:
# kubectl create secret generic agent-hub-secrets \
#   --from-literal=openclaw-verification-token="xxx" \
#   --from-literal=ssh-host="remote-host-ip" \
#   --from-literal=ssh-user="username" \
#   --from-literal=ssh-private-key="$(cat ~/.ssh/id_rsa)" \
#   --from-literal=feishu-app-id="cli_xxx" \
#   ... etc

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-hub.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # OpenClaw Configuration
  openclaw-verification-token: "{{ .Values.backend.env | dig \"openclaw-verification-token\" \"placeholder-token\" }}"
  
  # SSH Configuration
  ssh-host: "{{ .Values.backend.env | dig \"ssh-host\" \"placeholder-host\" }}"
  ssh-user: "{{ .Values.backend.env | dig \"ssh-user\" \"placeholder-user\" }}"
  ssh-private-key: "{{ .Values.backend.env | dig \"ssh-private-key\" \"placeholder-key\" }}"
  
  # Feishu Configuration
  feishu-app-id: "{{ .Values.backend.env | dig \"feishu-app-id\" \"placeholder\" }}"
  feishu-app-secret: "{{ .Values.backend.env | dig \"feishu-app-secret\" \"placeholder\" }}"
  feishu-chat-id: "{{ .Values.backend.env | dig \"feishu-chat-id\" \"placeholder\" }}"
  feishu-verify-token: "{{ .Values.backend.env | dig \"feishu-verify-token\" \"placeholder\" }}"
  
  # Security
  jwt-secret: "{{ .Values.backend.env | dig \"jwt-secret\" \"placeholder\" }}"
  encryption-key: "{{ .Values.backend.env | dig \"encryption-key\" \"placeholder\" }}"
{{- end }}
