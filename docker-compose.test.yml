version: '3.8'

# Test Environment - Isolated from development
# Uses separate test.db database
# Safe to reset/destroy without affecting dev data

services:
  # Test Backend - uses test.db (production build for speed and reliability)
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4001:4000"  # Port 4001 to avoid conflict with dev (4000)
    environment:
      - NODE_ENV=test
      - DATABASE_URL=file:./prisma/test.db
      - OPENCLAW_MODE=${OPENCLAW_MODE:-cli}
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL:-http://host.docker.internal:18789}
      - OPENCLAW_VERIFICATION_TOKEN=${OPENCLAW_VERIFICATION_TOKEN}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_CHAT_ID=${FEISHU_CHAT_ID}
      - FEISHU_VERIFY_TOKEN=${FEISHU_VERIFY_TOKEN}
      - JWT_SECRET=test-jwt-secret-min-32-characters-long
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Use separate test database volume
      - backend-test-data:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    networks:
      - test-network

  # Test Frontend - connects to test backend
  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://backend-test:4000
        - NEXT_PUBLIC_WS_URL=http://backend-test:4000
        - API_PROXY_URL=http://backend-test:4000
    ports:
      - "3001:3000"  # Port 3001 to avoid conflict with dev (3000)
    environment:
      - NODE_ENV=test
    depends_on:
      backend-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - test-network

# Separate volumes for test data
volumes:
  backend-test-data:
    driver: local

# Isolated network for test containers
networks:
  test-network:
    driver: bridge
