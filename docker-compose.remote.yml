version: '3.8'

services:
  # Main Agent Hub Backend
  backend:
    image: agent-hub-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      # OpenClaw Remote Mode
      OPENCLAW_MODE: remote
      OPENCLAW_VERIFICATION_TOKEN: ${OPENCLAW_VERIFICATION_TOKEN}
      
      # Database
      DATABASE_URL: file:/app/prisma/dev.db
      
      # Feishu Integration
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      FEISHU_CHAT_ID: ${FEISHU_CHAT_ID}
      FEISHU_VERIFY_TOKEN: ${FEISHU_VERIFY_TOKEN}
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Logging
      LOG_LEVEL: info
    
    volumes:
      # Mount OpenClaw config (contains gateway.remote.* settings)
      - ~/.openclaw:/root/.openclaw:ro
      # Persistent database
      - ./prisma-data:/app/prisma
      # Logs
      - ./logs:/app/logs
    
    ports:
      - "4000:4000"
    
    depends_on:
      ssh-tunnel:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    networks:
      - internal

  # SSH Tunnel Sidecar - Connects to remote OpenClaw Gateway
  ssh-tunnel:
    image: alpine/ssh:latest
    environment:
      SSH_HOST: ${SSH_HOST}
      SSH_USER: ${SSH_USER}
      SSH_PORT: ${SSH_PORT:-22}
    volumes:
      # SSH private key (must be chmod 600)
      - ./ssh-key:/root/.ssh/id_rsa:ro
      # Known hosts (optional, for extra security)
      - ./ssh-known_hosts:/root/.ssh/known_hosts:ro
    command: >
      sh -c "
        cp /root/.ssh/id_rsa /tmp/id_rsa &&
        chmod 600 /tmp/id_rsa &&
        ssh -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=60
            -o ServerAliveCountMax=3
            -o ExitOnForwardFailure=yes
            -o ConnectTimeout=10
            -N 
            -L 18789:${SSH_HOST}:18789 
            -i /tmp/id_rsa 
            ${SSH_USER}@${SSH_HOST}
      "
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "18789"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
