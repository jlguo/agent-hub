version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - OPENCLAW_MODE=remote
      - OPENCLAW_GATEWAY_URL=ws://127.0.0.1:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_VERIFICATION_TOKEN=${OPENCLAW_VERIFICATION_TOKEN}
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_CHAT_ID=${FEISHU_CHAT_ID}
      - FEISHU_VERIFY_TOKEN=${FEISHU_VERIFY_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume for persistent database storage
      - backend-data:/app/prisma
      # SSH key for remote OpenClaw Gateway access (Option 1: Volume Mount)
      - ${SSH_KEY_PATH:-~/.ssh/agent-hub}:/home/nodeuser/.ssh:ro
    # Use custom entrypoint for database initialization
    entrypoint: ["/usr/local/bin/docker-entrypoint-initdb.sh"]
    init: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - agent-hub-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://backend:4000
        - NEXT_PUBLIC_WS_URL=http://localhost:4000
        - API_PROXY_URL=http://backend:4000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - agent-hub-network

volumes:
  backend-data:
    driver: local

networks:
  agent-hub-network:
    driver: bridge
